{% extends "base.html" %}
{% load i18n %}

{% block title %}404 – Page introuvable | GreenMove{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;">
  <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true" class="mb-4">
    <circle cx="60" cy="60" r="58" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="36" font-weight="bold" fill="#2e7d32">404</text>
    <path d="M30 80 Q60 95 90 80" stroke="#2e7d32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>
  <h1 class="fw-bold mb-2" style="color:var(--gm-green-primary);">Page introuvable</h1>
  <p class="text-muted mb-4" style="max-width:420px;">
    Ce trajet n'existe pas encore sur GreenMove ! La page que vous cherchez a peut-être été déplacée ou supprimée.
  </p>
  <div class="d-flex gap-3 flex-wrap justify-content-center">
    <a href="{% url 'core:home' %}" class="btn btn-green-primary">
      <i class="bi bi-house-fill me-2" aria-hidden="true"></i>Accueil
    </a>
    <a href="{% url 'planner:index' %}" class="btn btn-green-outline">
      <i class="bi bi-signpost-split me-2" aria-hidden="true"></i>EcoPlanner
    </a>
  </div>
</div>
{% endblock %}
