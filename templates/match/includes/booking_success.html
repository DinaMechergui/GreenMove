{% load i18n %}
<div class="alert alert-success border-0 shadow-sm p-3 rounded-4" role="alert">
  <div class="d-flex align-items-center gap-3">
    <div class="p-2 rounded-circle bg-success text-white">
      <i class="bi bi-check-lg fs-4" aria-hidden="true"></i>
    </div>
    <div>
      <h6 class="fw-bold mb-1">{% trans "Demande envoyée au conducteur" %}</h6>
      <p class="small mb-1 text-dark">
        Votre demande de {{ booking.seats_requested }} place(s) est en attente de réponse.
      </p>
      <div class="small text-muted">
        Statut : <span class="badge bg-warning text-dark">En attente</span>
      </div>
    </div>
  </div>
</div>
