# ==============================================================================
# Configuration Nginx - Plateforme GreenMove (Hackathon Climat & IA 2026)
# Reverse-proxy HTTP vers Gunicorn et WebSockets vers Daphne ASGI
# ==============================================================================

upstream greenmove_http {
    server 127.0.0.1:8000;
}

upstream greenmove_websocket {
    server 127.0.0.1:8001;
}

# Redirection HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name greenmove.tn www.greenmove.tn;

    return 301 https://$host$request_uri;
}

# Serveur HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greenmove.tn www.greenmove.tn;

    # Certificats SSL (Let's Encrypt ou Certificats Hackathon)
    ssl_certificate /etc/letsencrypt/live/greenmove.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenmove.tn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille maximale des téléversements (ex: avatars)
    client_max_body_size 10M;

    # Fichiers Statiques Servis Directement par Nginx
    location /static/ {
        alias /var/www/greenmove/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Fichiers Médias (Avatars, QR Codes)
    location /media/ {
        alias /var/www/greenmove/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Routage WebSockets temps réel (Daphne ASGI)
    location /ws/ {
        proxy_pass http://greenmove_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts pour WebSockets stables
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Routage HTTP standard (Gunicorn WSGI)
    location / {
        proxy_pass http://greenmove_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Logs d'accès et d'erreur
    access_log /var/log/nginx/greenmove_access.log;
    error_log /var/log/nginx/greenmove_error.log;
}
