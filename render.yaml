databases:
  - name: greenmove-db
    databaseName: greenmove_db
    user: greenmove_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: greenmove-web
    env: python
    plan: free
    region: frankfurt
    branch: master
    buildCommand: "bash ./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --forwarded-allow-ips='*'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: greenmove-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: skander.bensalah@esprit.tn
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: GPS_ENCRYPTION_KEY
        value: greenmove-gps-fernet-secret-key-32chars-min-esprit-2026
      - key: TRANSPORT_MODEL_PATH
        value: tracker/ml/artifacts/transport_model.joblib
