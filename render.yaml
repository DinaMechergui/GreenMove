databases:
  - name: greenmove-db
    databaseName: greenmove_db
    user: postgres
    plan: free
    region: frankfurt

services:
  - type: web
    name: greenmove-web
    env: python
    plan: free
    region: frankfurt
    branch: master
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: greenmove-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: skander.bensalah@esprit.tn
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
